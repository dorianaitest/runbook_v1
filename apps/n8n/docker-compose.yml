services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    # Secrets (DB password + encryption key) come from load-secrets.sh
    # (Azure Key Vault) via shell env, interpolated below — no secrets on disk.
    # Deploy with:
    #   bash -c 'set -a && source .env && set +a \
    #     && source /srv/runbook_v1/load-secrets.sh && docker compose up -d'
    # (.env here holds only the 4 Azure bootstrap creds for load-secrets.sh.)
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:?}
      # Without this key stored credentials in the backup are worthless:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      N8N_HOST: n8n.demo-ki-instanz.de
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://n8n.demo-ki-instanz.de/
      N8N_PROXY_HOPS: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Berlin
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "720"
    volumes:
      - /srv/data/n8n:/home/node/.n8n
    networks:
      - proxy
      - app_net
    expose:
      - "5678"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.demo-ki-instanz.de`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt-dns"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=proxy"
      - "traefik.http.middlewares.n8n-ratelimit.rateLimit.average=300"
      - "traefik.http.middlewares.n8n-ratelimit.rateLimit.period=1m"
      - "traefik.http.middlewares.n8n-ratelimit.rateLimit.burst=600"
      - "traefik.http.routers.n8n.middlewares=n8n-ratelimit,frame-deny@file"

networks:
  proxy:
    external: true
  app_net:
    external: true
