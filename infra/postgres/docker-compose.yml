services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - /srv/data/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - app_net
    expose:
      - "5432"

networks:
  app_net:
    external: true
