services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    env_file: .env
    volumes:
      - /srv/data/n8n:/home/node/.n8n
    networks:
      - proxy
      - app_net
    expose:
      - "5678"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.demo-ki-instanz.de`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt-dns"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=proxy"
      - "traefik.http.middlewares.n8n-ratelimit.rateLimit.average=300"
      - "traefik.http.middlewares.n8n-ratelimit.rateLimit.period=1m"
      - "traefik.http.middlewares.n8n-ratelimit.rateLimit.burst=600"
      - "traefik.http.routers.n8n.middlewares=n8n-ratelimit,frame-deny@file"

networks:
  proxy:
    external: true
  app_net:
    external: true
