# Dummy RAG backend for the LibreChat citations spike (fictional data, no secrets).
# Usage:
#   docker compose -f /srv/apps/rag-stub/docker-compose.yml up -d --build
#
# LibreChat calls it internally at http://rag-stub:8000/v1 over app_net.
# Traefik exposes only so the citation links (/source/<id>) open in the browser.

services:
  rag-stub:
    build: .
    container_name: rag-stub
    restart: unless-stopped
    environment:
      - PUBLIC_BASE_URL=https://rag-stub.demo-ki-instanz.de
    expose:
      - "8000"
    networks:
      - app_net
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.rag-stub.rule=Host(`rag-stub.demo-ki-instanz.de`)"
      - "traefik.http.routers.rag-stub.entrypoints=websecure"
      - "traefik.http.routers.rag-stub.tls=true"
      - "traefik.http.routers.rag-stub.tls.certresolver=letsencrypt-dns"
      - "traefik.http.routers.rag-stub.middlewares=frame-deny@file"
      - "traefik.http.services.rag-stub.loadbalancer.server.port=8000"

networks:
  app_net:
    external: true
  proxy:
    external: true
