[project]
name = "voron-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dorianaitest", email = "dorianaitest@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
voron-rag = "voron_rag:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
